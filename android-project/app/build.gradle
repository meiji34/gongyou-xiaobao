plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gongyou.guanjia'
    compileSdk 34

    defaultConfig {
        applicationId "com.gongyou.guanjia"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "2.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
